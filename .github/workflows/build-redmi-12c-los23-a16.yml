name: Build Redmi 12C (LineageOS 23.2 A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "redmi_12c"
  DEVICE_CODENAME : "earth"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/Shangshanruo666/android_kernel_xiaomi_earth.git"
  KERNEL_BRANCH : "lineage-23.2"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.2/LLVM-22.1.2-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "earth_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk, next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineageos23_a16"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "Shangshanruo666/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "mi_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "redmi_12c" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "false" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KPM_ENABLE: "true" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Redmi 12C (LineageOS 23.2 A16)
    runs-on: ubuntu-24.04 # u can changed to ubuntu 22.04, and need container set ubuntu-24.04
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files

      - name: 🐛 Collect Debug Info
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p debug-info
          {
            echo "=== Run ==="
            echo "run_id=${{ github.run_id }} attempt=${{ github.run_attempt }} event=${{ github.event_name }}"
            echo "ref=${{ github.ref }} sha=${{ github.sha }}"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            echo
            echo "=== Key env ==="
            echo "KERNEL_VERSION=${{ env.KERNEL_VERSION }}"
            echo "KERNELSU_AUTO_FORK=${{ env.KERNELSU_AUTO_FORK }} KERNELSU_METHOD=${{ env.KERNELSU_METHOD }}"
            echo "SUSFS_ENABLE=${{ env.SUSFS_ENABLE }} SUSFS_FIXED=${{ env.SUSFS_FIXED }} SUSFS_PATCH_FIXED=${{ env.SUSFS_PATCH_FIXED }}"
            echo "HOOK_METHOD=${{ env.HOOK_METHOD }} KPM_ENABLE=${{ env.KPM_ENABLE }} BUILD_DEBUGGER=${{ env.BUILD_DEBUGGER }}"

            echo
            echo "=== Workspace top level ==="
            ls -la

            for r in device_kernel device_kernel/KernelSU NonGKI_Kernel_Patches; do
              if [ -d "$r/.git" ]; then
                echo
                echo "=== git: $r ==="
                git -C "$r" log -1 --format='head: %H | %ad | %s' --date=iso-strict 2>/dev/null || true
                echo "-- status --"
                git -C "$r" status --short 2>/dev/null | head -200 || true
              fi
            done

            echo
            echo "=== faccessat hook markers in fs/open.c ==="
            grep -n "ksu_handle_faccessat\|getname_flags\|orig_flow" device_kernel/fs/open.c 2>/dev/null | head -40 || echo "(no markers or fs/open.c not found)"

            echo
            echo "=== SUSFS .rej files ==="
            find device_kernel -name '*.rej' -not -path '*/out/*' 2>/dev/null | head -50 || true

            echo
            echo "=== defconfig tail ==="
            tail -n 40 "device_kernel/arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}" 2>/dev/null || true

            echo
            echo "=== error.log tail (150 lines) ==="
            tail -n 150 device_kernel/error.log 2>/dev/null || echo "(no error.log)"
          } > debug-info/debug-info.txt 2>&1

          if [ -f device_kernel/out/.config ]; then
            cp device_kernel/out/.config debug-info/build-final.config || true
          fi

          echo "[+] Debug info collected:"
          ls -l debug-info || true

      - name: 📦 Upload Workspace For Debug (even on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-debug-${{ env.DEVICE_CODENAME }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}
            !${{ github.workspace }}/.git/**
            !${{ github.workspace }}/*.tar.xz
            !${{ github.workspace }}/*.tar.gz
            !${{ github.workspace }}/*.zip
            !${{ github.workspace }}/*.img
            !${{ github.workspace }}/clang-custom/**
            !${{ github.workspace }}/gcc-64/**
            !${{ github.workspace }}/gcc-32/**
            !${{ github.workspace }}/mkdtbo/**
            !${{ github.workspace }}/mkboottools/**
            !${{ github.workspace }}/device_kernel/.git/**
            !${{ github.workspace }}/device_kernel/out/**
            !${{ github.workspace }}/device_kernel/tmp/**
            !${{ github.workspace }}/device_kernel/*.zip
            !${{ github.workspace }}/device_kernel/AnyKernel3/.git/**
            !${{ github.workspace }}/device_kernel/KernelSU/.git/**
            !${{ github.workspace }}/NonGKI_Kernel_Patches/.git/**
          include-hidden-files: true
          follow-symbolic-links: false
          if-no-files-found: ignore
          retention-days: 7
